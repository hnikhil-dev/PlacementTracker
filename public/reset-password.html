<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Placement Tracker</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .hidden { display: none !important; }
        .input-icon-wrap { position: relative; }
        .input-icon-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 0.9rem; pointer-events: none; }
        .input-icon-wrap .form-input { padding-left: 42px; }
        .msg-success { color: #16a34a; font-size: 0.88rem; font-weight: 500; text-align: center; margin-top: 12px; background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 10px 14px; }
        .msg-error   { color: #dc2626; font-size: 0.88rem; font-weight: 500; text-align: center; margin-top: 12px; background: #fef2f2; border: 1px solid #fca5a5; border-radius: 8px; padding: 10px 14px; }
    </style>
</head>

<body>

    <div class="auth-container">

        <!-- LEFT PANEL -->
        <div class="auth-left-panel">
            <div class="auth-left-brand">
                <i class="fas fa-graduation-cap"></i>
                <span>Placement Tracker</span>
            </div>
            <h2>Secure your account, secure your future.</h2>
            <ul class="auth-features">
                <li><i class="fas fa-check-circle"></i> Reset your password securely via email link</li>
                <li><i class="fas fa-check-circle"></i> Your data is safe and encrypted</li>
                <li><i class="fas fa-check-circle"></i> Get back to browsing opportunities instantly</li>
            </ul>
        </div>

        <!-- RIGHT FORM PANEL -->
        <div class="auth-right-panel">
            <div class="auth-card">

                <div class="auth-header">
                    <div style="width:60px;height:60px;background:#eef7f0;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.6rem;color:#25a244;">
                        <i class="fas fa-lock-open"></i>
                    </div>
                    <h1 id="pageTitle">Forgot Password?</h1>
                    <p id="pageDesc">Enter your email to receive a reset link.</p>
                </div>

                <!-- Request Reset Link -->
                <form id="requestForm" style="text-align:left;">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-icon-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="resetEmail" class="form-input" placeholder="student@college.edu" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.85rem;font-size:0.95rem;">
                        <span id="reqBtnText">Send Reset Link</span>
                        <i id="reqLoader" class="fas fa-circle-notch fa-spin hidden"></i>
                    </button>
                </form>

                <!-- Set New Password -->
                <form id="newPassForm" class="hidden" style="text-align:left;">
                    <input type="hidden" id="token">
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <div class="input-icon-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="newPassword" class="form-input" placeholder="Min. 6 characters" required minlength="6">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.85rem;font-size:0.95rem;">
                        <span id="newBtnText">Update Password</span>
                        <i id="newLoader" class="fas fa-circle-notch fa-spin hidden"></i>
                    </button>
                </form>

                <p id="msg" class="hidden"></p>

                <div class="auth-links" style="justify-content:center; margin-top:1.5rem;">
                    <a href="index.html"><i class="fas fa-arrow-left" style="margin-right:6px;"></i>Back to Login</a>
                </div>

            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        const requestForm = document.getElementById('requestForm');
        const newPassForm = document.getElementById('newPassForm');
        const msg = document.getElementById('msg');

        if (resetToken) {
            document.title = 'Set New Password - Placement Tracker';
            document.getElementById('pageTitle').innerText = 'Reset Password';
            document.getElementById('pageDesc').innerText = 'Enter your new secure password below.';
            requestForm.classList.add('hidden');
            newPassForm.classList.remove('hidden');
            document.getElementById('token').value = resetToken;
        }

        function showMsg(text, type) {
            msg.innerText = text;
            msg.className = type === 'success' ? 'msg-success' : 'msg-error';
            msg.classList.remove('hidden');
        }

        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const btnText = document.getElementById('reqBtnText');
            const loader = document.getElementById('reqLoader');
            btnText.innerText = 'Sending...';
            loader.classList.remove('hidden');
            msg.classList.add('hidden');
            try {
                const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await safeJson(res);
                if (res.ok) {
                    showMsg(data.message || 'Reset link sent to your email.', 'success');
                } else {
                    showMsg(getErrorMessage(data, 'User not found or email delivery failed.'), 'error');
                }
            } catch (err) {
                showMsg('Network error. Please check your connection.', 'error');
            } finally {
                btnText.innerText = 'Send Reset Link';
                loader.classList.add('hidden');
            }
        });

        newPassForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const tokenVal = document.getElementById('token').value;
            const btnText = document.getElementById('newBtnText');
            const loader = document.getElementById('newLoader');
            btnText.innerText = 'Updating...';
            loader.classList.remove('hidden');
            msg.classList.add('hidden');
            try {
                const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: tokenVal, newPassword })
                });
                const data = await safeJson(res);
                if (res.ok) {
                    showMsg('Password updated! Redirecting to login...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    showMsg(getErrorMessage(data, 'Reset failed. The token may be expired or invalid.'), 'error');
                }
            } catch (err) {
                showMsg('Network error. Please check your connection.', 'error');
            } finally {
                btnText.innerText = 'Update Password';
                loader.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
